<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::layout(~{::section})}">

<head>
  <meta charset="ISO-8859-1">
  <title>Shopshere</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Glass container */
    .glass-card {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-5px);
    }

    /* Slider */
    .carousel-item img {
      border-radius: 16px;
      object-fit: cover;
    }

    /* Product cards */
    .product-title {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 10px;
    }

    .product-card img {
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(5px);
      padding: 8px;
      transition: transform 0.3s ease;
    }

    .product-card img:hover {
      transform: scale(1.05);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .category-img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      background: transparent;
      mix-blend-mode: multiply;
      /* removes white background effect */
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.2));
    }

    .category-title {
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 700;
      color: #222;
    }

    .carousel-img {
      height: 350px;
      object-fit: cover;
      object-position: center;
    }

    /* Make carousel arrows darker for visibility */
    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      filter: invert(1);
    }
  </style>
</head>

<body>
  <section>
    <!-- Start Slider -->

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="" class="d-block w-100" alt="..." height="350px">
            </div>
            <div class="carousel-item">
                <img src="img/ecom3.jpg" class="d-block w-100" alt="..." height="350px">
            </div>
            <div class="carousel-item">
                <img src="img/ecom2.jpg" class="d-block w-100" alt="..." height="350px">
            </div>
        </div>
        <button class="carousel-control-prev" type="button"
                data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button"
                data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>

        </button>
    </div> -->
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img class="d-block w-100 carousel-img" src="img/ecom2.jpg" alt="First-slide">
        </div>
        <div class="carousel-item">
          <img class="d-block w-100 carousel-img" src="img/ecom-1.jpg" alt="Second-slide">
        </div>
        <div class="carousel-item">
          <img class="d-block w-100 carousel-img" src="img/ecom3.jpg" alt="Third-slide">
        </div>
      </div>
    </div>

    <!-- End Slider -->

    <!-- Category Section -->
    <div class="category-section py-5">
      <div class="container-fluid">
        <p class="text-center category-title fs-2 fw-bold mb-4">Explore Categories</p>

        <!-- Carousel -->
        <div id="categoryCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">

            <!-- Group items in sets of 4 -->
            <div class="carousel-item active">
              <div class="row g-0 text-center">
                <div class="col-3" th:each="c, iterStat : ${category}">
                  <div class="glass-card category-card p-3 h-100">
                    <div class="image-wrapper d-flex justify-content-center align-items-center mb-3">
                      <img th:src="@{'img/category_img/'+${c.imageName}}" class="category-img"
                        th:alt="${c.name} + ' category'">
                    </div>
                    <a th:href="@{'/products?category='+${c.name}}"
                      class="stretched-link fw-semibold text-dark text-decoration-none">
                      [[${c.name}]]
                    </a>
                  </div>
                </div>
              </div>
            </div>

            <!-- Repeat dynamically for every 4 categories using Thymeleaf -->
            <div class="carousel-item" th:each="chunk, iterStat : ${#numbers.sequence(1, (category.size()/4))}">
              <div class="row g-0 text-center">
                <div class="col-3"
                  th:each="c : ${category.subList(iterStat.index*4, (iterStat.index*4)+4 > category.size() ? category.size() : (iterStat.index*4)+4)}">
                  <div class="glass-card category-card p-3 h-100">
                    <div class="image-wrapper d-flex justify-content-center align-items-center mb-3">
                      <img th:src="@{'img/category_img/'+${c.imageName}}" class="category-img"
                        th:alt="${c.name} + ' category'">
                    </div>
                    <a th:href="@{'/products?category='+${c.name}}"
                      class="stretched-link fw-semibold text-dark text-decoration-none">
                      [[${c.name}]]
                    </a>
                  </div>
                </div>
              </div>
            </div>

          </div>

          <!-- Carousel Controls -->
          <button class="carousel-control-prev" type="button" data-bs-target="#categoryCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#categoryCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>
      </div>
    </div>


    <!-- Latest Products -->
    <div class="container-fluid p-5">
      <p class="text-center category-title">Latest Product</p>
      <div class="row justify-content-center">
        <div class="col-md-3 mb-4" th:each="p:${products}">
          <div class="glass-card text-center p-3 product-card">
            <img th:src="@{'img/product_img/'+${p.image}}" width="65%" height="140px">
            <p class="product-title"><a th:href="@{'/product/'+${p.id}}" class="text-decoration-none">[[${p.title}]]</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
